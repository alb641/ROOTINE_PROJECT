        .btn-bronze { background-color: #CBA328; color: white; border: none; font-weight: bold; }
        .btn-bronze:hover { background-color: #b08d22; color: white; }
    </style>
</head>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html" style="color: #230C0F !important;">The Rootine System</a>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center mb-4">
            <h1 class="display-5 fw-bold">Reach Out</h1>
            <p>Have questions about your diagnosis? Email us at <br><strong>therootinesystem@gmail.com</strong></p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 bg-white p-5 rounded shadow-sm">
            <form action="#">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="firstName" class="form-label fw-bold">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="lastName" class="form-label fw-bold">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="emailAddr" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="emailAddr" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="subject" class="form-label fw-bold">Hair Type (if known)</label>
                    <select class="form-select" id="subject">
                        <option selected>Choose...</option>
                        <option value="2">Type 2 (Wavy)</option>
                        <option value="3">Type 3 (Curly)</option>
                        <option value="4">Type 4 (Coily)</option>
                        <option value="0">Unsure / Need Diagnosis</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label fw-bold">Your Message</label>
                    <textarea class="form-control" id="message" rows="4" required></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-bronze px-5 py-2">Submit Message</button>
                </div>
            </form>
        </div>
    </div>
</div>
